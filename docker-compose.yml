services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tdff
      POSTGRES_PASSWORD: tdff
      POSTGRES_DB: tdff_dev
    ports:
      - '5432:5432'
    volumes:
      - tdff_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tdff -d tdff_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tdff_postgres_data:
